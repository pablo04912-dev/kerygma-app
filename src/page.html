<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kerygma">
<meta name="theme-color" content="#F6F4EF">
<title>Kerygma prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316181D'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='32' fill='%23F6F4EF' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
html{font-size:106.25%}
@supports (font:-apple-system-body) and (-webkit-touch-callout:none){html{font:-apple-system-body}}
html,body{margin:0;height:100%;background:#F6F4EF;touch-action:pan-x pan-y;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#app{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;background:#F6F4EF;overflow:hidden}
@media (min-width:560px){#app{border-left:1px solid #E7E3DA;border-right:1px solid #E7E3DA}}
a{color:#3730A3}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #4338CA;outline-offset:2px}
input:focus,textarea:focus{outline:2px solid #4338CA;outline-offset:1px}
button,a,span{overflow-wrap:break-word}
#app *{scrollbar-width:none}#app *::-webkit-scrollbar{display:none}
button:active:not([aria-disabled=true]),a:active{box-shadow:inset 0 0 0 999px rgba(22,24,29,.08)}
#app.clavier nav[aria-label="Navigation principale"]{display:none}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-accueil">
<!--ACCUEIL-->
</template>
<template id="tpl-planning">
<!--PLANNING-->
</template>
<template id="tpl-serviteur">
<!--SERVITEUR-->
</template>
<script>
/*MOTEUR*/
</script>
<script>
// Téléphone : effet au toucher sur iPhone, et clavier ouvert : l'écran se réduit à la partie visible
// (feuilles et champ de message restent au-dessus du clavier, barre du bas masquée)
(function () {
  document.addEventListener('touchstart', function () {}, { passive: true });
  var app = document.getElementById('app');
  var vv = window.visualViewport;
  var dernier = null;
  document.addEventListener('pointerdown', function (e) { if (!/^(TEXTAREA|INPUT)$/.test(e.target.tagName)) dernier = null; }, true);
  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (!t || !/^(TEXTAREA|INPUT)$/.test(t.tagName) || (t.id && t.id === dernier)) return;
    dernier = t.id || null;
    var bloc = t.closest('[data-composer]') || t;
    setTimeout(function () { if (bloc.isConnected) bloc.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 350);
  });
  if (!vv) return;
  function maj() {
    var clavier = window.innerHeight - vv.height > 120;
    app.classList.toggle('clavier', clavier);
    app.style.top = clavier ? vv.offsetTop + 'px' : '';
    app.style.height = clavier ? vv.height + 'px' : '';
    app.style.bottom = clavier ? 'auto' : '';
  }
  vv.addEventListener('resize', maj);
  vv.addEventListener('scroll', maj);
})();
</script>
</body>
</html>
